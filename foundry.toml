[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

# See https://getfoundry.sh/forge/advanced-testing/invariant-testing/#storage-aware-fuzz-inputs
extra_output = ["storageLayout"]

gas_limit = 2000000000
gas_reports = ["ABDKBondingCurve", "PRBBondingCurve"]

ignored_error_codes = [
  1878, # missing SPDX
  2424, # use of deprecated Natspec comment "memory-safe-assembly" in forge-std
  3860, # contract initcode size
  5574, # contract code size
  4591, # more than 256 warnings
]

[profile.ci]

[profile.formal.model_checker]
engine = "bmc"
timeout = 10000
targets = ["assert"]
invariants = ["contract"]
showUnproved = true
showProvedSafe = true

[invariant]
fail_on_revert = true
runs = 100
depth = 10
# shrink_run_limit = 0
# failure_persist_dir = "/dev/null"

[lint]
exclude_lints = [
  "erc20-unchecked-transfer", # System uses only trusted OZ ERC20s, which revert on failure
  "pascal-case-struct",
  "mixed-case-variable",
  "mixed-case-function",
  "screaming-snake-case-immutable",
  "block-timestamp",
]

# Used when deploying to a local fork to prevent broadcast pollution
[profile.simulation]
broadcast = "simulation"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
